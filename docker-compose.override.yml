# docker-compose.override.yml
# Local developer overrides applied automatically on top of docker-compose.yml.
# NOT committed with secrets — add your own overrides here locally.

services:
  backend:
    # Bind-mount source for hot-reload. The venv lives at /opt/venv (outside /app)
    # so it is never shadowed by this mount.
    volumes:
      - ./backend:/app
      - storage:/app/storage
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      PYTHONPATH: /app
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'
      "

  celery_worker:
    volumes:
      - ./backend:/app
      - storage:/app/storage
    environment:
      APP_ENV: development
    command: >
      celery -A app.celery_app worker
        --loglevel=debug
        --queues=default,qr_export,qr_batch,scan_analytics
        --concurrency=2
        --prefetch-multiplier=1

  # Vite dev server with HMR instead of the production nginx build.
  # Listens on port 80 to match the upstream in nginx/nginx.conf.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=/api
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,.pointqr.com,monkey-v-1,all}
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "80"]
