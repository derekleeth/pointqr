[project]
name = "pointqr-backend"
version = "0.1.0"
description = "PointQR – QR Code Generation Platform API"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",           # async driver – used by FastAPI / uvicorn
    "psycopg2-binary>=2.9.9",    # sync driver – used by Celery tasks (avoids asyncpg event-loop conflicts)
    "alembic>=1.14.0",
    # Validation
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    # QR code generation
    "segno>=1.6.1",
    "pillow>=10.4.0",
    # Task queue
    "celery>=5.4.0",
    "aio-pika>=9.4.0",
    # File uploads
    "python-multipart>=0.0.12",
    # HTTP client (used in tests + SSRF validation later)
    "httpx>=0.27.0",
    # User-Agent parsing (redirect service – device/OS/browser detection)
    "user-agents>=2.2.0",
    # TTLCache for redirect LRU cache
    "cachetools>=5.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends.legacy:build"
