services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pointqr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pointqr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pointqr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pointqr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - pointqr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pointqr} -d ${POSTGRES_DB:-pointqr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # RabbitMQ 3.13 with Management UI
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pointqr_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pointqr}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pointqr_dev_password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - pointqr_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: pointqr_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      RABBITMQ_MGMT_USER: ${RABBITMQ_DEFAULT_USER:-pointqr}
      RABBITMQ_MGMT_PASS: ${RABBITMQ_DEFAULT_PASS:-pointqr_dev_password}
      METRICS_INTERVAL_S: ${METRICS_INTERVAL_S:-3}
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pointqr_network
    expose:
      - "8000"
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2} --proxy-headers --forwarded-allow-ips='*'
      "

  # ---------------------------------------------------------------------------
  # Celery Worker (same image as backend, different command)
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: pointqr_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pointqr_network
    command: >
      celery -A app.celery_app worker
        --loglevel=info
        --queues=default,qr_export,qr_batch,scan_analytics
        --concurrency=4
        --prefetch-multiplier=1

  # ---------------------------------------------------------------------------
  # Celery Beat – Periodic task scheduler
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: pointqr_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      # Share the storage volume so beat_schedule_filename (/app/storage/celerybeat-schedule)
      # persists across container restarts and survives image rebuilds.
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pointqr_network
    # Only one Beat instance must run at a time – do not scale this service.
    command: >
      celery -A app.celery_app beat
        --loglevel=info
        --schedule=/app/storage/celerybeat-schedule


  # ---------------------------------------------------------------------------
  # Vue 3 Frontend (Vite dev server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pointqr_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=/api
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,.pointqr.com,monkey-v-1,all}
    networks:
      - pointqr_network
    expose:
      - "5173"

  # ---------------------------------------------------------------------------
  # Nginx – Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: pointqr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Mount the shared storage volume so Nginx can serve /static/ directly
      # from disk without proxying through FastAPI (faster + avoids path issues)
      - storage:/app/storage:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pointqr_network

  # ---------------------------------------------------------------------------
  # Mailpit – Multi-arch (ARM64/x86) SMTP catcher (MailHog replacement)
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: pointqr_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI
    networks:
      pointqr_network:
        aliases:
          - mailhog

# -----------------------------------------------------------------------------
# Named Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  storage:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  pointqr_network:
    driver: bridge

