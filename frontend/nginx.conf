# Static file server for the built Vue SPA (used by frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Vite emits content-hashed filenames under /assets/ – safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Un-hashed public files (logos, robots.txt, sitemap.xml)
    location ~* \.(png|jpe?g|svg|ico|webp|txt|xml)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback – let vue-router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
