worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Increase upload size for logo / batch CSV uploads
    client_max_body_size 20M;

    # -------------------------------------------------------------------------
    # Cloudflare Real IP configuration
    # Restores original visitor IP from CF-Connecting-IP when traffic passes
    # through Cloudflare. If the request does not come from a Cloudflare IP,
    # $remote_addr is left unchanged.
    # -------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # -------------------------------------------------------------------------
    # WebSocket connection header map
    # Passes "upgrade" for WS handshakes, "close" for regular HTTP requests.
    # Must be inside http{} – the map directive is not valid at the top level.
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve client scheme from upstream proxy (e.g. Cloudflare) or fallback to $scheme
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Use Docker's embedded DNS so Nginx re-resolves container hostnames
    # after rebuilds (prevents stale-IP 502 errors).
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        # SSL termination (Cloudflare Origin CA or local self-signed)
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ------------------------------------------------------------------
        # API – proxy to FastAPI (REST + WebSocket)
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend/;
            proxy_http_version 1.1;

            # Required for WebSocket upgrade (e.g. /api/v1/admin/ws/metrics)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   CF-IPCountry      $http_cf_ipcountry;

            # Keep WebSocket connections open for up to 1 hour idle
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ------------------------------------------------------------------
        # Static files – logos and exports served directly from the storage
        # volume by Nginx (faster than proxying through FastAPI, and avoids
        # ASGI path-matching issues for files created at runtime by Celery).
        # ------------------------------------------------------------------
        location /static/ {
            alias /app/storage/;

            # Security: never execute anything in this directory
            default_type application/octet-stream;

            # Cache immutable exports aggressively; logos can be revalidated
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";

            # Return a clean 404 (not FastAPI JSON) for missing files
            try_files $uri =404;
        }

        # ------------------------------------------------------------------
        # QR redirect service – /r/{short_code} → FastAPI (no /api prefix)
        # Must be declared before the catch-all location / so nginx matches
        # it first; without this the request falls through to the Vue SPA.
        # ------------------------------------------------------------------
        location /r/ {
            proxy_pass         http://backend/r/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   CF-IPCountry      $http_cf_ipcountry;
        }

        # ------------------------------------------------------------------
        # Vue Vite Dev Server (with HMR WebSocket support)
        # ------------------------------------------------------------------
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

